<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Reading · The Leigh Household</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lib/pdfjs/pdf_viewer.css?v=5">

<style>
:root {
  --navy-deep: #0D1B2A;
  --navy: #1F3864;
  --gold: #BF9000;
  --gold-light: #D4AB3A;
  --cream: #F4F1EA;
  --paper: #FAF8F3;
  --ink: #1A1B23;
  --ink-soft: #4A4D5C;
  --rule: rgba(0, 0, 0, 0.08);
  --chrome-bg: rgba(244, 241, 234, 0.98);
  --chrome-fg: var(--navy);
  --chrome-rule: rgba(31, 56, 100, 0.15);
  --desk: #D9D4C8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--desk);
  color: var(--ink);
  font-family: 'Inter', sans-serif;
}

/* === TOP BAR === */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; height: 60px;
  background: var(--chrome-bg);
  border-bottom: 1px solid var(--chrome-rule);
  display: flex; align-items: center; gap: 0.5rem;
  padding: 0 1.25rem; z-index: 100;
}
.brand {
  font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; font-weight: 600; font-style: italic;
  color: var(--chrome-fg); margin-right: auto; letter-spacing: 0.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.brand .accent { color: var(--gold); margin: 0 0.4rem; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 38px; height: 38px; flex: none;
  background: transparent; border: none; color: var(--chrome-fg);
  cursor: pointer; border-radius: 4px; text-decoration: none;
  font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 1.05rem;
}
.icon-btn:hover, .icon-btn.on { background: var(--gold); color: #fff; }
.icon-btn svg { width: 20px; height: 20px; }

/* === PDF STAGE === */
#viewerContainer {
  position: absolute; top: 60px; bottom: 50px; left: 0; right: 0;
  overflow: auto; -webkit-overflow-scrolling: touch;
  touch-action: pan-x pan-y;
  background: var(--desk);
}
.pdfViewer { padding: 12px 0 28px; }
.pdfViewer .page {
  margin: 0 auto 14px !important;
  border: none !important;
  box-shadow: 0 3px 18px rgba(0, 0, 0, 0.22), 0 0 0 1px rgba(0, 0, 0, 0.05);
  background-clip: padding-box;
}
/* search highlight colors in the book's palette */
.textLayer .highlight { background-color: rgba(191, 144, 0, 0.35); }
.textLayer .highlight.selected { background-color: rgba(191, 144, 0, 0.75); }

/* === LOADING / ERROR === */
.overlay {
  position: absolute; inset: 60px 0 50px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center; padding: 2rem;
  background: var(--paper); color: var(--ink-soft); z-index: 30; transition: opacity 0.4s;
}
.overlay.hidden { opacity: 0; pointer-events: none; }
.mark { font-family: 'Cormorant Garamond', serif; font-size: 3rem; color: var(--gold); margin-bottom: 0.5rem; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 0.4; transform: rotate(0); } 50% { opacity: 1; transform: rotate(180deg); } }
.overlay-text { font-size: 0.75rem; letter-spacing: 0.3em; text-transform: uppercase; }
.load-bar { width: 180px; height: 3px; background: var(--rule); border-radius: 3px; margin-top: 1rem; overflow: hidden; }
.load-bar div { height: 100%; width: 0; background: var(--gold); transition: width 0.2s; }
.overlay .err-title { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; color: var(--ink); margin: 0.5rem 0 0.75rem; }
.overlay a.btn { display: inline-block; margin-top: 1.25rem; padding: 0.75rem 1.5rem; background: var(--gold); color: #fff; text-decoration: none; font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; border-radius: 3px; }

/* === ZOOM CONTROL === */
.zoombar {
  position: fixed; bottom: 62px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 2px; padding: 4px;
  background: var(--chrome-bg); border: 1px solid var(--chrome-rule); border-radius: 999px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18); z-index: 25;
}
.zoombar { transition: opacity 0.35s ease; }
.zoombar.faded { opacity: 0; pointer-events: none; }
.zoombar button {
  min-width: 40px; height: 36px; padding: 0 0.6rem; border: none; background: transparent;
  color: var(--chrome-fg); font-family: 'Inter', sans-serif; font-size: 1.15rem; font-weight: 500;
  border-radius: 999px; cursor: pointer;
}
.zoombar button:hover { background: rgba(191, 144, 0, 0.15); }
.zoombar .zoom-level { font-size: 0.75rem; min-width: 58px; letter-spacing: 0.04em; }

/* === BOTTOM BAR === */
.bottombar {
  position: fixed; bottom: 0; left: 0; right: 0; height: 50px;
  background: var(--chrome-bg); border-top: 1px solid var(--chrome-rule);
  display: flex; align-items: center; gap: 1rem; padding: 0 1.25rem; z-index: 100;
}
.chapter-label { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 0.9rem; color: var(--chrome-fg); max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.progress { flex: 1; height: 3px; background: var(--rule); border-radius: 3px; overflow: hidden; position: relative; }
.progress-bar { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--gold); transition: width 0.3s; }
.page-text { font-size: 0.7rem; font-weight: 500; letter-spacing: 0.12em; color: var(--chrome-fg); text-transform: uppercase; white-space: nowrap; }

/* === SIDE PANELS (contents + search) === */
.panel {
  position: fixed; top: 60px; bottom: 50px; width: 360px; max-width: 100%;
  background: var(--cream); z-index: 60; display: flex; flex-direction: column;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 0 30px rgba(0, 0, 0, 0.14);
}
.panel.left { left: 0; transform: translateX(-105%); border-right: 1px solid var(--chrome-rule); }
.panel.right { right: 0; transform: translateX(105%); border-left: 1px solid var(--chrome-rule); width: 400px; }
.panel.open { transform: translateX(0); }
.panel-title {
  font-family: 'Cormorant Garamond', serif; font-size: 1rem; font-weight: 600; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--gold); padding: 1.25rem 1.25rem 0.9rem;
  border-bottom: 1px solid var(--chrome-rule);
}
.panel-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.toc-list { list-style: none; padding: 0.6rem 0.75rem 2rem; }
.toc-list ul { list-style: none; margin-left: 0.85rem; padding-left: 0.6rem; border-left: 1px solid var(--chrome-rule); }
.toc-list button {
  display: flex; width: 100%; gap: 0.5rem; align-items: baseline; text-align: left;
  padding: 0.42rem 0.5rem; border: none; background: transparent; border-radius: 3px; cursor: pointer;
  font-family: 'Cormorant Garamond', serif; font-size: 1rem; line-height: 1.3; color: var(--ink);
}
.toc-list button .pg { margin-left: auto; font-family: 'Inter', sans-serif; font-size: 0.7rem; color: var(--ink-soft); }
.toc-list > li > button { font-weight: 600; font-size: 1.05rem; color: var(--navy); padding: 0.6rem 0.5rem; }
.toc-list button:hover { background: rgba(191, 144, 0, 0.12); color: var(--gold); }
.toc-list button.current { background: rgba(191, 144, 0, 0.18); color: var(--gold); }

.search-form { display: flex; gap: 0.5rem; padding: 1rem; border-bottom: 1px solid var(--chrome-rule); }
.search-input {
  flex: 1; min-width: 0; padding: 0.7rem 0.85rem; font-family: 'Inter', sans-serif;
  font-size: 16px; color: var(--ink); background: var(--paper);
  border: 1px solid var(--chrome-rule); border-radius: 4px; outline: none;
}
.search-input:focus { border-color: var(--gold); }
.search-go { padding: 0 1rem; border: none; border-radius: 4px; background: var(--gold); color: #fff; font-family: 'Inter', sans-serif; font-size: 0.8rem; font-weight: 500; cursor: pointer; }
.search-status { padding: 0.6rem 1rem; font-size: 0.75rem; color: var(--ink-soft); border-bottom: 1px solid var(--chrome-rule); }
.search-status:empty { display: none; }
.search-results { list-style: none; }
.search-results .group { padding: 0.75rem 1rem 0.35rem; font-family: 'Cormorant Garamond', serif; font-size: 0.95rem; font-weight: 600; color: var(--gold); position: sticky; top: 0; background: var(--cream); }
.search-results button {
  display: block; width: 100%; text-align: left; padding: 0.7rem 1rem; border: none; border-bottom: 1px solid var(--rule);
  background: transparent; color: var(--ink); font-family: 'Cormorant Garamond', serif; font-size: 1rem; line-height: 1.4; cursor: pointer;
}
.search-results button .pg { display: block; font-family: 'Inter', sans-serif; font-size: 0.68rem; letter-spacing: 0.08em; color: var(--ink-soft); margin-top: 0.2rem; text-transform: uppercase; }
.search-results button:hover, .search-results button.active { background: rgba(191, 144, 0, 0.12); }
.search-results mark { background: rgba(191, 144, 0, 0.35); color: inherit; padding: 0 1px; border-radius: 2px; }

/* === PHONES === */
@media (max-width: 720px) {
  .topbar { height: 56px; padding: 0 0.6rem; gap: 0.15rem; }
  .icon-btn { width: 34px; height: 34px; }
  .brand { font-size: 0.9rem; }
  .brand .accent { margin: 0 0.3rem; font-size: 0.6em; vertical-align: 0.15em; }
  #viewerContainer, .overlay { top: 56px; bottom: 46px; }
  .overlay { inset: 56px 0 46px; }
  .bottombar { height: 46px; padding: 0 0.85rem; }
  .chapter-label { display: none; }
  .panel, .panel.right { top: 56px; bottom: 46px; width: 100%; }
  .zoombar { bottom: 56px; }
  .pdfViewer { padding-top: 8px; }
  .pdfViewer .page { margin-bottom: 8px !important; }
}
@media (max-width: 370px) {
  .brand em:first-child, .brand .accent { display: none; }
}
</style>
</head>
<body>

<header class="topbar">
  <button class="icon-btn" id="toc-toggle" aria-label="Contents">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="brand"><em>The Leigh</em><span class="accent">◆</span><em>Household</em></div>
  <button class="icon-btn" id="search-toggle" aria-label="Search the book">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
  </button>
  <a class="icon-btn" href="Leigh_Butler_Book.pdf" download aria-label="Download the PDF">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>
  </a>
  <a class="icon-btn" href="text.html" aria-label="Text view" title="Text view (flowing text)">Aa</a>
  <a class="icon-btn" href="index.html" aria-label="Back to landing">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  </a>
</header>

<aside class="panel left" id="toc-panel" aria-label="Contents">
  <div class="panel-title">Contents</div>
  <div class="panel-body"><ul class="toc-list" id="toc"></ul></div>
</aside>

<aside class="panel right" id="search-panel" aria-label="Search">
  <form class="search-form" id="search-form" autocomplete="off">
    <input class="search-input" id="search-input" type="search" placeholder="Search the book" enterkeyhint="search">
    <button class="search-go" type="submit">Search</button>
  </form>
  <div class="search-status" id="search-status"></div>
  <div class="panel-body"><ul class="search-results" id="search-results"></ul></div>
</aside>

<div id="viewerContainer">
  <div id="viewer" class="pdfViewer"></div>
</div>

<div class="overlay" id="loading">
  <div class="mark">◆</div>
  <div class="overlay-text">Opening the Book…</div>
  <div class="load-bar"><div id="load-bar"></div></div>
</div>

<div class="zoombar" id="zoombar">
  <button id="zoom-out" aria-label="Zoom out">&minus;</button>
  <button class="zoom-level" id="zoom-fit" aria-label="Fit page">Fit</button>
  <button id="zoom-in" aria-label="Zoom in">+</button>
</div>

<footer class="bottombar">
  <span class="chapter-label" id="chapter-label">&nbsp;</span>
  <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
  <span class="page-text" id="page-text">&nbsp;</span>
</footer>

<script type="module">
import * as pdfjsLib from './lib/pdfjs/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = './lib/pdfjs/pdf.worker.min.mjs';
globalThis.pdfjsLib = pdfjsLib;   // the viewer module reads it from here

const PDF_URL = 'Leigh_Butler_Book.pdf?v=5';
const PAGE_KEY = 'leigh-pdf-page';
const isPhone = () => window.innerWidth < 720;
const fitValue = () => isPhone() ? 'page-width' : 'page-fit';

const $ = id => document.getElementById(id);
const container = $('viewerContainer');
let pdfDoc, viewer, findController, linkService, eventBus;
let chapterStarts = [];   // [{page, title}]
let pageTexts = null;     // per-page text for search, built on first search

// Printed page numbers: page 1 of the PDF is the cover, so the book's own
// numbering (in the footers and contents) is one less.
let pageLabels = null;  // printed page numbers from the PDF: Cover, i–vi, then 1…
const printed = n => (pageLabels && pageLabels[n - 1]) || (n <= 1 ? 'Cover' : String(n - 1));
let bodyPages = 0;

async function start() {
  const { PDFViewer, EventBus, PDFLinkService, PDFFindController } = await import('./lib/pdfjs/pdf_viewer.mjs');
  eventBus = new EventBus();
  linkService = new PDFLinkService({ eventBus });
  findController = new PDFFindController({ eventBus, linkService });
  viewer = new PDFViewer({
    container, viewer: $('viewer'), eventBus, linkService, findController,
    removePageBorders: true,
    // phones (especially iPhones) limit canvas memory; keep each page canvas modest
    maxCanvasPixels: ('ontouchstart' in window) ? 4194304 : 16777216,
  });
  linkService.setViewer(viewer);

  eventBus.on('pagesinit', () => {
    viewer.currentScaleValue = fitValue();
    const saved = parseInt(localStorage.getItem(PAGE_KEY) || '1', 10);
    if (saved > 1 && saved <= pdfDoc.numPages) viewer.currentPageNumber = saved;
    updatePage(viewer.currentPageNumber);
    $('loading').classList.add('hidden');
  });
  eventBus.on('pagechanging', e => updatePage(e.pageNumber));
  eventBus.on('scalechanging', () => { updateZoomLabel(); showZoom(); });

  const task = pdfjsLib.getDocument({ url: PDF_URL, isEvalSupported: false });
  task.onProgress = p => { if (p.total) $('load-bar').style.width = Math.round(100 * p.loaded / p.total) + '%'; };
  try {
    pdfDoc = await task.promise;
  } catch (err) {
    console.error(err);
    $('loading').innerHTML = '<div class="mark" style="animation:none">◆</div><div class="err-title">Unable to open the book</div>' +
      '<div>Please refresh the page, or open the PDF directly.</div><a class="btn" href="Leigh_Butler_Book.pdf">Open the PDF</a>';
    return;
  }
  try { pageLabels = await pdfDoc.getPageLabels(); } catch (e) { pageLabels = null; }
  bodyPages = pageLabels ? pageLabels.filter(l => /^\d+$/.test(l)).length : pdfDoc.numPages - 1;
  viewer.setDocument(pdfDoc);
  linkService.setDocument(pdfDoc, null);
  buildContents();
}

// ---------- page / progress ----------
function updatePage(n) {
  if (!pdfDoc) return;
  const lab = printed(n);
  $('page-text').textContent = n <= 1 ? `Cover · ${pdfDoc.numPages} pages` : (/^\d+$/.test(lab) ? `Page ${lab} of ${bodyPages}` : `Page ${lab}`);
  $('progress-bar').style.width = Math.round(100 * (n - 1) / Math.max(1, pdfDoc.numPages - 1)) + '%';
  localStorage.setItem(PAGE_KEY, n);
  let ch = null;
  for (const c of chapterStarts) if (c.page <= n) ch = c;
  $('chapter-label').textContent = ch ? ch.title : ' ';
  document.querySelectorAll('.toc-list > li > button').forEach(b => b.classList.toggle('current', ch && b.dataset.page == ch.page));
}

// ---------- zoom ----------
function updateZoomLabel() {
  const v = viewer.currentScaleValue;
  $('zoom-fit').textContent = (v === 'page-width' || v === 'page-fit') ? 'Fit' : Math.round(viewer.currentScale * 100) + '%';
}
$('zoom-in').onclick = () => viewer.increaseScale();
$('zoom-out').onclick = () => viewer.decreaseScale();
$('zoom-fit').onclick = () => { viewer.currentScaleValue = fitValue(); };

// Pinch to zoom and double-tap, kept inside the book (the page itself never zooms)
let pinch = null, lastTap = 0;
const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
container.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    pinch = { d: dist(e.touches) };
  } else if (e.touches.length === 1) {
    const now = Date.now(), t = e.touches[0];
    if (now - lastTap < 300) {
      e.preventDefault();
      const fitted = viewer.currentScaleValue === fitValue();
      if (fitted) viewer.updateScale({ scaleFactor: 2.2, origin: [t.clientX, t.clientY] });
      else viewer.currentScaleValue = fitValue();
      lastTap = 0;
    } else lastTap = now;
  }
}, { passive: false });
container.addEventListener('touchmove', e => {
  if (pinch && e.touches.length === 2) {
    e.preventDefault();
    const d = dist(e.touches), f = d / pinch.d;
    if (Math.abs(f - 1) > 0.03) {
      const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2, cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      viewer.updateScale({ scaleFactor: f, origin: [cx, cy], drawingDelay: 350 });
      pinch.d = d;
    }
  }
}, { passive: false });
container.addEventListener('touchend', e => { if (e.touches.length < 2) pinch = null; });
document.addEventListener('gesturestart', e => e.preventDefault());
container.addEventListener('wheel', e => {
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    viewer.updateScale({ scaleFactor: e.deltaY < 0 ? 1.1 : 1 / 1.1, origin: [e.clientX, e.clientY], drawingDelay: 250 });
  }
}, { passive: false });

// Zoom control shows on tap, scroll stop or zoom, then fades so it never sits on the text
const zb = $('zoombar'); let zbTimer;
function showZoom(ms = 2600) {
  zb.classList.remove('faded'); clearTimeout(zbTimer);
  zbTimer = setTimeout(() => zb.classList.add('faded'), ms);
}
zb.addEventListener('pointerdown', () => showZoom(3500));
let scrollStop;
container.addEventListener('scroll', () => { clearTimeout(scrollStop); scrollStop = setTimeout(() => showZoom(), 180); }, { passive: true });
container.addEventListener('click', () => showZoom());
showZoom(4000);

// ---------- contents (from the PDF's bookmarks) ----------
async function destPage(dest) {
  try {
    const d = typeof dest === 'string' ? await pdfDoc.getDestination(dest) : dest;
    if (!d) return null;
    return (await pdfDoc.getPageIndex(d[0])) + 1;
  } catch (e) { return null; }
}
async function buildContents() {
  const outline = await pdfDoc.getOutline() || [];
  const ul = $('toc');
  async function render(items, into, depth) {
    for (const it of items) {
      const title = it.title.replace(/\s+/g, ' ').trim();
      if (depth > 0 && /^table of contents$/i.test(title)) continue;
      const page = await destPage(it.dest);
      if (depth === 0 && page) chapterStarts.push({ page, title });
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.innerHTML = `<span></span><span class="pg">${page ? printed(page) : ''}</span>`;
      b.firstChild.textContent = title;
      if (page) b.dataset.page = page;
      b.onclick = () => { linkService.goToDestination(it.dest); closePanels(); };
      li.appendChild(b);
      if (it.items && it.items.length && depth < 1) {
        const sub = document.createElement('ul');
        await render(it.items, sub, depth + 1);
        li.appendChild(sub);
      }
      into.appendChild(li);
    }
  }
  await render(outline, ul, 0);
  updatePage(viewer.currentPageNumber);
}

// ---------- search ----------
const escapeHtml = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const escapeRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
let searchRun = 0;

async function loadTexts(run) {
  if (pageTexts) return pageTexts;
  const texts = [];
  for (let i = 1; i <= pdfDoc.numPages; i++) {
    if (run !== searchRun) return null;
    const page = await pdfDoc.getPage(i);
    const tc = await page.getTextContent();
    texts.push(tc.items.map(it => it.str + (it.hasEOL ? ' ' : '')).join('').replace(/\s+/g, ' ')
      .replace(/\s*(Chapter \d+:[^]*?)?The Leigh Household Butler Book\s*\S*\s*$/, '').replace(/\s+[ivx\d]+\s*$/, ''));
    if (i % 20 === 0) $('search-status').textContent = `Reading the book… ${Math.round(100 * i / pdfDoc.numPages)}%`;
  }
  pageTexts = texts;
  return texts;
}

async function runSearch(q) {
  q = q.trim();
  const run = ++searchRun;
  const list = $('search-results'), status = $('search-status');
  list.innerHTML = '';
  if (q.length < 2) { status.textContent = 'Type at least two letters.'; return; }
  status.textContent = 'Searching…';
  const texts = await loadTexts(run);
  if (!texts || run !== searchRun) return;
  const re = new RegExp(escapeRe(q), 'gi');
  let total = 0, lastChapter = null;
  texts.forEach((t, idx) => {
    const page = idx + 1;
    const hits = [...t.matchAll(re)];
    if (!hits.length) return;
    let ch = null; for (const c of chapterStarts) if (c.page <= page) ch = c;
    const chTitle = ch ? ch.title : 'Front matter';
    if (chTitle !== lastChapter) {
      const head = document.createElement('li'); head.className = 'group'; head.textContent = chTitle;
      list.appendChild(head); lastChapter = chTitle;
    }
    hits.slice(0, 20).forEach((m, k) => {
      total++;
      const a = Math.max(0, m.index - 70), z = Math.min(t.length, m.index + m[0].length + 90);
      const ex = escapeHtml(t.slice(a, z)).replace(new RegExp(escapeRe(escapeHtml(q)), 'gi'), s => `<mark>${s}</mark>`);
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.innerHTML = `${a > 0 ? '…' : ''}${ex}${z < t.length ? '…' : ''}<span class="pg">Page ${printed(page)}</span>`;
      b.onclick = () => goToHit(q, page, k, b);
      li.appendChild(b); list.appendChild(li);
    });
  });
  status.textContent = total ? `${total} match${total === 1 ? '' : 'es'} for “${q}”` : `No matches for “${q}”`;
}

function goToHit(q, page, nth, btn) {
  document.querySelectorAll('.search-results button.active').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (isPhone()) closePanels();
  viewer.currentPageNumber = page;
  // highlight every match; the selected one is the first from this page on
  eventBus.dispatch('find', { source: null, type: '', query: q, caseSensitive: false, entireWord: false, highlightAll: true, findPrevious: false, matchDiacritics: false });
  for (let i = 0; i < nth; i++) {
    setTimeout(() => eventBus.dispatch('find', { source: null, type: 'again', query: q, caseSensitive: false, entireWord: false, highlightAll: true, findPrevious: false, matchDiacritics: false }), 120 * (i + 1));
  }
}

$('search-form').addEventListener('submit', e => { e.preventDefault(); $('search-input').blur(); runSearch($('search-input').value); });

// ---------- panels ----------
function closePanels() { $('toc-panel').classList.remove('open'); $('search-panel').classList.remove('open'); syncButtons(); }
function syncButtons() {
  $('toc-toggle').classList.toggle('on', $('toc-panel').classList.contains('open'));
  $('search-toggle').classList.toggle('on', $('search-panel').classList.contains('open'));
}
$('toc-toggle').onclick = e => { e.stopPropagation(); $('search-panel').classList.remove('open'); $('toc-panel').classList.toggle('open'); syncButtons(); };
$('search-toggle').onclick = e => {
  e.stopPropagation(); $('toc-panel').classList.remove('open');
  const open = $('search-panel').classList.toggle('open'); syncButtons();
  if (open) setTimeout(() => $('search-input').focus(), 250);
};
document.addEventListener('click', e => {
  if (!e.target.closest('.panel') && !e.target.closest('#toc-toggle') && !e.target.closest('#search-toggle')) closePanels();
});

// ---------- keyboard ----------
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input')) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
    e.preventDefault(); $('toc-panel').classList.remove('open'); $('search-panel').classList.add('open'); syncButtons(); $('search-input').focus(); return;
  }
  if (!viewer) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { viewer.nextPage(); e.preventDefault(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { viewer.previousPage(); e.preventDefault(); }
  else if (e.key === '+' || e.key === '=') viewer.increaseScale();
  else if (e.key === '-') viewer.decreaseScale();
  else if (e.key === '0') viewer.currentScaleValue = fitValue();
  else if (e.key === 'Escape') closePanels();
});

// keep "Fit" fitting after rotating the phone or resizing the window
let rt;
window.addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    if (!viewer) return;
    const v = viewer.currentScaleValue;
    if (v === 'page-width' || v === 'page-fit') viewer.currentScaleValue = fitValue();
  }, 200);
});

start();
</script>
</body>
